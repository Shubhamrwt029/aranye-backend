x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ../${ARANYE_ENV_FILE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - private
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - private
    logging: *default-logging

  api:
    image: aranye-backend:${ARANYE_IMAGE_TAG}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../${ARANYE_ENV_FILE}
    ports:
      - "127.0.0.1:${API_BIND_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - private
    logging: *default-logging

  scratch-worker:
    image: aranye-backend:${ARANYE_IMAGE_TAG}
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["/app/.venv/bin/python", "-m", "scripts.scratch_card_worker"]
    restart: unless-stopped
    env_file:
      - ../${ARANYE_ENV_FILE}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - private
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:

networks:
  private:
