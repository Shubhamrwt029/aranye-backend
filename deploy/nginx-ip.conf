server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 110M;

    location = /api/staging {
        return 308 /api/staging/;
    }

    location = /api/staging/health {
        proxy_pass http://127.0.0.1:8100/health;
    }

    location = /api/staging/ready {
        proxy_pass http://127.0.0.1:8100/ready;
    }

    location ~ ^/api/staging/(docs|redoc|openapi\.json)$ {
        proxy_pass http://127.0.0.1:8100/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/staging/docs/token {
        proxy_pass http://127.0.0.1:8100/docs/token;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/staging/static/ {
        proxy_pass http://127.0.0.1:8100/static/;
    }

    location /api/staging/ {
        proxy_pass http://127.0.0.1:8100/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api/staging;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location = /api/production {
        return 308 /api/production/;
    }

    location = /api/production/health {
        proxy_pass http://127.0.0.1:8200/health;
    }

    location = /api/production/ready {
        proxy_pass http://127.0.0.1:8200/ready;
    }

    location ~ ^/api/production/(docs|redoc|openapi\.json)$ {
        proxy_pass http://127.0.0.1:8200/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/production/docs/token {
        proxy_pass http://127.0.0.1:8200/docs/token;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/production/static/ {
        proxy_pass http://127.0.0.1:8200/static/;
    }

    location /api/production/ {
        proxy_pass http://127.0.0.1:8200/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api/production;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
